{% extends 'base.html' %}

{% block content %}

<section >
    
    
    <div class="container" >
        <div class="row mt-4">
            {% for course in courses %}
            <div class=" сol-12 col-md-6 col-lg-3">
                <div class="item-wrapper" style="border:2px solid black; background-color: black;">
                    {% if course.image %}
                    <div class="item-img">
                        <img src="{{course.image.url}}" alt="course image" height="170vh", width="100%">
                    </div>
                    {%endif%}
                    <div class="item-content"style="padding: 10px;">
                        <p class="" style="color: white;">{{course.name}}</p>
                        
                        <p class="">careers <br>{{course.career | truncatewords:3}} </p>
                    </div>
                    <div class="">
                        <a href="{% url 'course:entries' pk=course.category.pk  %}" class="btn btn-success item-btn display-7" >See More
                            &gt;</a>
                        
                    </div>
                </div>
            </div>
            {% endfor%}
        </div>
    </div>
</section>

{% endblock  %}

{% extends 'base.html' %}

{% block content %}
<ul class="row ">
      {% if request.user.is_superuser %}
    <div class="cat-details donate admin-add">
        <a class="small-font" href="{% url 'course:entry_new' %}">+ADD ENTRY</a>
    </div>
    {%endif%}

    
</ul>
<section data-bs-version="5.1" class="features3 cid-tqRM189Gig" id="features3-z">
    
    
    <div class="container">
        <div class="mbr-section-head">
            <h4 class="mbr-section-title mbr-fonts-style align-center mb-0 display-2">
                <strong>Features</strong></h4>
            
        </div>
        <div class="row mt-4">
            {% for course in courses %}
            <div class="item features-image сol-12 col-md-6 col-lg-3">
                <div class="item-wrapper">
                    {% if course.image %}
                    <div class="item-img">
                        <img src="{{course.image.url}}" alt="course image" style="height: 40vh;">
                    </div>
                    {%endif%}
                    <div class="item-content">
                        <h5 class="item-title mbr-fonts-style display-7"><strong>{{course.name}}</strong></h5>
                        
                        <p class="mbr-text mbr-fonts-style mt-3 display-7">careers <br>{{course.career}} </p>
                    </div>
                    <div class="mbr-section-btn item-footer mt-2">
                        <a href="{% url 'course:entries' pk=course.category.pk  %}" class="btn btn-primary item-btn display-7" >More
                            &gt;</a>
                        
                    </div>
                </div>
            </div>
            {% endfor%}
        </div>
    </div>
</section>

{% endblock  %}

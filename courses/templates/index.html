{% extends 'base.html' %}
{% block content%}

 <!-- ======= category Section ======= -->
 <section class="features4 category">
    
    <div class="mbr-overlay"></div>
    <div class="container-fluid">
            <h4>
                <strong>Career Types</strong></h4>
            <h5><em>Right career better life</em></h5>
        <div class="row mt-4">
            {% for career in categories %}
            <div class="item features-image сol-12 col-md-6 col-lg-4 active">
                <div class="item-wrapper" style="border:2px solid black; color: black;">
               
                    <div class="item-content">
                            
                            
                        <h3 class="">{{career.name}}</h3>
                    </div>
                        <div class="item-content">
                            
                            
                            <p class=" mt-3 display-7">{{career.description |truncatechars:175}}</p>
                        </div>
                        <div class="mbr-section-btn item-footer mt-2">
                            <a href="{% url 'course:career_type_detail' pk=career.pk %}" class="btn item-btn btn-success display-7">Read more &gt;&gt;</a>
                            <a href="{% url 'course:categories' pk=career.pk %}" class="btn item-btn btn-success display-7" >See Courses &gt;&gt;</a>
                        </div>
                </div>
                </div> {% endfor%}
            </div>
           
           
          
            

        </div>
    </div>
</section> 
<!-- End category Section -->


{%endblock content%}
